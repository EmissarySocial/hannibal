name: Nilaway
permissions:
  contents: read

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  GOFLAGS: "-buildvcs=false"

jobs:

  nilaway:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    # setup-go sets GOTOOLCHAIN=local, so the runner must satisfy go.mod exactly; a pinned
    # "1.26.x" resolves to the runner's cached 1.26.9 and refuses any newer directive.
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    # Pin nilaway to an explicit version (it publishes only pseudo-versions,
    # no semver tags) so the installed tool is predictable, not @latest.
    - name: Install NilAway
      run: go install go.uber.org/nilaway/cmd/nilaway@v0.0.0-20260918162853-acb8859b9031

    - name: Nil panic checks
      run: nilaway ./...
